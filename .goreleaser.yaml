# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hopsock

before:
    hooks:
        - go mod tidy
        - go test ./...

builds:
    - id: hopsock
      main: ./cmd/hopsock
      binary: hopsock
      env:
          - CGO_ENABLED=0
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X main.version={{ .Tag }}
          - -X main.commit={{ .FullCommit }}
          - -X main.date={{ .CommitDate }}
      mod_timestamp: "{{ .CommitTimestamp }}"
      goos: [linux, darwin, windows]
      goarch: [amd64, arm64]

archives:
    - formats: [tar.gz]
      format_overrides:
          - goos: windows
            formats: [zip]
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
      files:
          - LICENSE
          - README.md
          - CHANGELOG.md

checksum:
    name_template: checksums.txt

snapshot:
    version_template: "{{ incpatch .Version }}-next"

changelog:
    sort: asc
    use: github
    filters:
        exclude:
            - "^docs:"
            - "^test:"
            - "^chore:"
            - "^ci:"
    groups:
        - title: Features
          regexp: '^.*?feat(\(.+\))??!?:.+$'
          order: 0
        - title: Fixes
          regexp: '^.*?fix(\(.+\))??!?:.+$'
          order: 1
        - title: Other
          order: 999

release:
    github:
        owner: abdullahwaqar
        name: hopsock
    prerelease: auto
    footer: |
        Install with Go: `go install github.com/abdullahwaqar/hopsock/cmd/hopsock@{{ .Tag }}`
